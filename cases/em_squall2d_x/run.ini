# em_squall2d_x for CPPWRF-Web: tools/wrf2cppwrf.py --format wrfout on namelist.input (WRF v4.8.0
# test/em_squall2d_x with mp_physics = 1 (Kessler) and use_netcdf_classic = .true.). Paths are relative to
# this directory: run the model from here (natively) or with this directory as the working directory (wasm).
[run]
case = em_squall2d_x
run_time = 3600

[domain]
nx = 201
ny = 1
nz = 80
dx = 250
dy = 250
ztop = 20000
bc_x = open
bc_y = periodic

[case]
sounding_file = input_sounding

[time]
dt = 3
time_step_sound = 6

[dyn]
khdif = 300
kvdif = 1
damp_opt = 2
zdamp = 5000
dampcoef = 0.003
diff_opt = 2
km_opt = 2
mix_full_fields = true
moist_adv_opt = 1
hybrid_opt = 0
tke_adv_opt = 1

[moist]
species = qv, qc, qr

[phys]
mp_physics = 1

[restart]
interval = 3600

[output]
wrf_namelist = namelist.input
diag_interval = 10
out_interval = 200
format = wrfout
