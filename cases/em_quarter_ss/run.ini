# em_quarter_ss for CPPWRF-Web: tools/wrf2cppwrf.py --format wrfout on namelist.input (WRF v4.8.0
# test/em_quarter_ss with use_netcdf_classic = .true.). Paths are relative to this directory.
[run]
case = em_quarter_ss
run_time = 3600

[domain]
nx = 41
ny = 41
nz = 40
dx = 2000
dy = 2000
ztop = 20000
bc_x = open
bc_y = open

[case]
sounding_file = input_sounding

[time]
dt = 12
time_step_sound = 6

[dyn]
khdif = 500
kvdif = 500
damp_opt = 2
zdamp = 5000
dampcoef = 0.003
diff_opt = 2
km_opt = 2
mix_full_fields = true
moist_adv_opt = 1
hybrid_opt = 0
tke_adv_opt = 1

[moist]
species = qv, qc, qr

[phys]
mp_physics = 1

[restart]
interval = 7200

[output]
wrf_namelist = namelist.input
diag_interval = 10
out_interval = 150
format = wrfout
